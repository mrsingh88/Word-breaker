<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Word Breaker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🧠 Word Breaker</h1>

        <p class="subtitle">
            Crack the hidden English word
        </p>

        <!-- Game information -->

        <div class="info">

            <div>
                Word:
                <strong id="wordLength">5</strong> letters
            </div>

            <div>
                Chances:
                <strong id="chances">5</strong>
            </div>

        </div>

        <!-- Game board -->

        <div id="gameBoard"></div>

        <!-- Keyboard -->

        <div id="keyboard"></div>

        <!-- Message -->

        <div id="message"></div>

        <!-- New game -->

        <button id="newGameBtn">
            New Game
        </button>

        <!-- Statistics -->

        <div class="stats">

            <h2>📊 Statistics</h2>

            <div class="stats-grid">

                <div>
                    <strong id="gamesPlayed">0</strong>
                    <span>Played</span>
                </div>

                <div>
                    <strong id="gamesWon">0</strong>
                    <span>Won</span>
                </div>

                <div>
                    <strong id="winRate">0%</strong>
                    <span>Win Rate</span>
                </div>

                <div>
                    <strong id="streak">0</strong>
                    <span>Streak</span>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
