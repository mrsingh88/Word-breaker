<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Word Breaker - an analytical English word guessing game"
    >

    <title>🧠 Word Breaker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🧠 Word Breaker</h1>

            <p class="subtitle">
                Crack the hidden English word
            </p>
        </header>


        <!-- Game information -->

        <section class="info">

            <div>
                <span>Word</span>
                <strong id="wordLength">5</strong>
                <span>letters</span>
            </div>

            <div>
                <span>Chances</span>
                <strong id="chances">5</strong>
            </div>

        </section>


        <!-- Loading -->

        <div id="loading" class="loading">

            <div class="spinner"></div>

            <p>
                Loading English words...
            </p>

        </div>


        <!-- Game board -->

        <section
            id="gameBoard"
            aria-label="Word guessing board"
        ></section>


        <!-- Message -->

        <div
            id="message"
            role="status"
            aria-live="polite"
        ></div>


        <!-- Keyboard -->

        <section
            id="keyboard"
            aria-label="Keyboard"
        ></section>


        <!-- New Game -->

        <button
            id="newGameBtn"
            class="new-game"
        >
            🔄 New Game
        </button>


        <!-- Statistics -->

        <section class="stats">

            <h2>📊 Statistics</h2>

            <div class="stats-grid">

                <div>
                    <strong id="gamesPlayed">0</strong>
                    <span>Played</span>
                </div>

                <div>
                    <strong id="gamesWon">0</strong>
                    <span>Won</span>
                </div>

                <div>
                    <strong id="winRate">0%</strong>
                    <span>Win Rate</span>
                </div>

                <div>
                    <strong id="streak">0</strong>
                    <span>Streak</span>
                </div>

            </div>

        </section>


        <!-- API information -->

        <footer>

            <small>
                Word data powered by
                <a
                    href="https://www.datamuse.com/api/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Datamuse
                </a>
            </small>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
